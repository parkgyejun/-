name: Test KTX v3 Login UI

on:
  push:
    branches: [ktx-seat-watcher-build]
    paths:
      - 'ktx-v3-login-test/**'
      - '.github/workflows/test-ktx-v3-login.yml'
  workflow_dispatch:

jobs:
  emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct project
        run: |
          mkdir -p ktx-v3-work
          base64 -d ktx-v3-login-test/payload.b64 > /tmp/ktx-v3.zip
          cd ktx-v3-work
          unzip -q /tmp/ktx-v3.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - uses: android-actions/setup-android@v3

      - name: Install SDK and build
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64'
          cd ktx-v3-work
          gradle --no-daemon :app:assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Create emulator
        run: |
          echo no | avdmanager create avd -n ktx_test -k 'system-images;android-35;google_apis;x86_64' --force

      - name: Boot emulator
        run: |
          nohup emulator -avd ktx_test -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none > /tmp/emulator.log 2>&1 &
          adb wait-for-device
          for i in $(seq 1 180); do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$BOOT" = "1" ]; then break; fi
            sleep 2
          done
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Install and run login self-test
        run: |
          adb install -r ktx-v3-work/app/build/outputs/apk/debug/app-debug.apk
          adb logcat -c
          adb shell am start -n com.personal.ktxwatcher/.MainActivity --ez SELF_TEST_LOGIN true
          sleep 15
          adb logcat -d -s KTX_SELF_TEST:I '*:S' | tee /tmp/selftest.log
          adb exec-out screencap -p > /tmp/ktx-login-screen.png
          adb shell uiautomator dump /sdcard/window.xml >/dev/null
          adb pull /sdcard/window.xml /tmp/window.xml >/dev/null
          grep -q 'SEARCH_DISABLED_AT_START=true' /tmp/selftest.log
          grep -q 'HAS_LOGIN_BUTTON=true' /tmp/selftest.log
          grep -q 'HAS_SETTINGS_BUTTON=true' /tmp/selftest.log
          grep -q 'HAS_START_STOP=true' /tmp/selftest.log
          grep -q 'LOGIN_DOM=OK' /tmp/selftest.log
          grep -q 'kakao=true' /tmp/selftest.log
          grep -q 'apple=true' /tmp/selftest.log

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KTX-v3-login-test-evidence
          path: |
            /tmp/selftest.log
            /tmp/ktx-login-screen.png
            /tmp/window.xml
            /tmp/emulator.log
            ktx-v3-work/app/build/outputs/apk/debug/app-debug.apk
