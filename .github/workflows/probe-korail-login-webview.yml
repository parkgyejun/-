name: Probe Korail Login WebView
on:
  push:
    branches: [ktx-seat-watcher-build]
    paths: ['.github/workflows/probe-korail-login-webview.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - uses: android-actions/setup-android@v3
      - name: Create probe app
        run: |
          mkdir -p probe/app/src/main/java/test/korail
          cat > probe/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='Probe'; include ':app'
          EOF
          cat > probe/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '9.4.0' apply false }
          EOF
          cat > probe/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android { namespace 'test.korail'; compileSdk 36
            defaultConfig { applicationId 'test.korail'; minSdk 28; targetSdk 36; versionCode 1; versionName '1' }
          }
          EOF
          cat > probe/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:theme="@android:style/Theme.Material.Light.NoActionBar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          cat > probe/app/src/main/java/test/korail/MainActivity.java <<'EOF'
          package test.korail;
          import android.app.*; import android.os.*; import android.util.Log; import android.webkit.*;
          public class MainActivity extends Activity {
            public void onCreate(Bundle b){super.onCreate(b); WebView w=new WebView(this); setContentView(w); WebSettings s=w.getSettings(); s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); CookieManager.getInstance().setAcceptCookie(true); CookieManager.getInstance().setAcceptThirdPartyCookies(w,true); w.setWebViewClient(new WebViewClient(){ public void onPageFinished(WebView v,String u){ super.onPageFinished(v,u); new Handler().postDelayed(()->v.evaluateJavascript("(()=>{const q=s=>!!document.querySelector(s),t=document.body?.innerText||'';return JSON.stringify({url:location.href,id:q('#id')||q('input[name=id]'),pw:q('#password')||q('input[type=password]'),login:[...document.querySelectorAll('button,a')].some(e=>(e.innerText||'').trim()==='로그인'),kakao:t.includes('카카오 로그인'),apple:t.includes('Apple 로그인')||t.includes('애플 로그인')})})()",r->Log.i("KORAIL_PROBE",r)),3000); }}); w.loadUrl("https://www.korail.com/ticket/login"); }
          }
          EOF
      - name: Install build SDK and build probe
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          cd probe && gradle --no-daemon :app:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Run probe in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot
          script: |
            adb install -r probe/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -n test.korail/.MainActivity
            sleep 15
            adb logcat -d -s KORAIL_PROBE:I '*:S' | tee /tmp/probe.log
            adb exec-out screencap -p > /tmp/probe.png
            grep -q '"id":true' /tmp/probe.log
            grep -q '"pw":true' /tmp/probe.log
            grep -q '"login":true' /tmp/probe.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: korail-login-webview-probe-v2
          path: |
            /tmp/probe.log
            /tmp/probe.png
